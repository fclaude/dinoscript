<!doctype html>
<html lang="$language">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="$subtitle">
  $page_links
  <link rel="stylesheet" href="${assets}styles.css">
  <script defer src="https://analytics.recoded.cl/script.js" data-website-id="cc0f3635-1173-4e50-9c45-3c2bdd2c339b"></script>
  <title>$title · $online_workbook</title>
</head>
<body>
  <a class="skip-link" href="#main">$skip</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="./"><img class="brand-mark" src="${assets}pip.png" width="32" height="32" alt=""> Dinoscript</a>
      <nav aria-label="$main_navigation">
        <a href="./#downloads">$downloads</a>
        <a href="workbook.html" aria-current="page">$workbook</a>
        <a href="play/">$play_try_browser</a>
        <a href="$repository">GitHub <span aria-hidden="true">↗</span></a>
        $language_links
      </nav>
    </div>
  </header>

  <main class="wrap workbook" id="main">
    <header class="workbook-intro">
      <p class="eyebrow">$workbook_eyebrow</p>
      <h1>$title</h1>
      <p class="intro">$subtitle</p>
      <p>$by</p>
      <div class="actions">
        <a class="button primary" href="#lesson-1">$start_lesson <span aria-hidden="true">↓</span></a>
        <a class="button secondary" href="$pdf" download>$download_pdf <span aria-hidden="true">↓</span></a>
      </div>
    </header>
    <div class="workbook-layout">
      <nav class="contents" id="contents" aria-labelledby="contents-title">
        <h2 id="contents-title">$contents_heading</h2>
        $contents
      </nav>
      <div class="chapters">
        <p class="pip-quote">$welcome</p>
        $chapters
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span>© 2023–2026 $author</span>
      <a href="$repository/blob/$tag/LICENSE">$license</a>
    </div>
  </footer>
</body>
</html>
