name: Publish dinoscript.org

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - scripts/build-site.py
      - .github/workflows/pages.yml
  repository_dispatch:
    types: [dinoscript-release-published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  queue: max

jobs:
  build:
    name: Build the site for the latest release
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Find the latest published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - name: Check out the released workbook
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          path: build/released
          sparse-checkout: book
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build static files
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          python -m pip install Pillow
          args=()
          if curl --fail --silent --show-error --retry 2 --max-time 20 \
              https://api.github.com/repos/fclaude/fclaude-packages/releases/latest \
              --output build/linux-release.json; then
            args=(--linux-release build/linux-release.json)
          fi
          python scripts/build-site.py "$RELEASE_TAG" --book-dir build/released/book "${args[@]}"
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/site
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the site
        id: deployment
        uses: actions/deploy-pages@v4
