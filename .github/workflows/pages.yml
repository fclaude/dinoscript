name: Publish dinoscript.org

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - scripts/build-site.py
      - .github/workflows/pages.yml
  repository_dispatch:
    types: [dinoscript-release-published]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  queue: max

jobs:
  releases:
    name: Check published releases
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      app: ${{ steps.latest.outputs.app }}
      linux_id: ${{ steps.latest.outputs.linux_id }}
      build: ${{ steps.latest.outputs.build }}
    steps:
      - id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          app="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          linux="$(gh api repos/fclaude/fclaude-packages/releases/latest)"
          linux_tag="$(jq -er .tag_name <<< "$linux")"
          linux_id="$(jq -er .id <<< "$linux")"
          [[ "$app" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$linux_tag" =~ ^packages-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]+$ && "$linux_id" =~ ^[0-9]+$ ]]
          build=true
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            page="$RUNNER_TEMP/published.html"
            curl -fsSL --retry 2 --max-time 20 https://dinoscript.org/ -o "$page"
            if grep -Fq "href=\"https://github.com/$GITHUB_REPOSITORY/releases/tag/$app\"" "$page" &&
               grep -Fq "data-tag=\"$linux_tag\"" "$page"; then
              build=false
            fi
          fi
          printf 'app=%s\nlinux_id=%s\nbuild=%s\n' "$app" "$linux_id" "$build" >> "$GITHUB_OUTPUT"

  build:
    name: Build the site for the latest release
    needs: releases
    if: needs.releases.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out the released workbook
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.releases.outputs.app }}
          path: build/released
          sparse-checkout: book
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build static files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.releases.outputs.app }}
          LINUX_RELEASE_ID: ${{ needs.releases.outputs.linux_id }}
        run: |
          python -m pip install Pillow
          gh api "repos/fclaude/fclaude-packages/releases/$LINUX_RELEASE_ID" > build/linux-release.json
          python scripts/build-site.py "$RELEASE_TAG" --book-dir build/released/book --linux-release build/linux-release.json
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/site
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the site
        id: deployment
        uses: actions/deploy-pages@v4
