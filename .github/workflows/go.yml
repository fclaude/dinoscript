name: Go and desktop checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  checks:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Unit and desktop UI tests
        run: go test -count=1 -timeout=90s ./...
      - name: Static checks
        run: go vet ./...
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race -count=1 -timeout=2m ./...
      - name: Package macOS app bundles and disk images
        if: runner.os == 'macOS'
        run: |
          sh scripts/package-mac.sh arm64
          sh scripts/package-mac.sh amd64
      - name: Package Windows x64 executable
        if: runner.os == 'Windows'
        shell: bash
        run: sh scripts/package-windows.sh
      - name: Collect macOS development builds
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: Dinoscript-mac-development
          path: build/mac-*/*.dmg
          if-no-files-found: error
      - name: Collect Windows development build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: Dinoscript-windows-x64-development
          path: build/windows-amd64/
          if-no-files-found: error

  site:
    name: Build the site and test the Wasm interpreter
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run interpreter and workbook tests in Wasm
        env:
          GOOS: js
          GOARCH: wasm
        run: go test -timeout=60s -exec "$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./internal/dino ./book
      - name: Build static files
        env:
          RELEASE_TAG: ${{ (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v0.0.0' }}
        run: |
          python -m pip install Pillow
          python scripts/build-site.py "$RELEASE_TAG"

  release:
    name: Publish checked release assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [checks, site]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: build/release-artifacts
      - name: Publish the tested builds and Pip's book
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh

  publish-site:
    name: Queue the GitHub Pages deployment
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Trigger Pages deployment from the default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --raw-field event_type=dinoscript-release-published
